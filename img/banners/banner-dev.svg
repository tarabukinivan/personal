    <rect x="0" y="26" width="400" height="14" fill="#161b22"/>
    <circle cx="24" cy="20" r="6" fill="#f85149"/>
    <circle cx="46" cy="20" r="6" fill="#d29922"/>
    <circle cx="68" cy="20" r="6" fill="#2ea043"/>
    <text x="28" y="86" fill="#8b949e" font-size="17">1  <tspan fill="#22d3ee">class</tspan> <tspan fill="#10b981">Engineer</tspan>:</text>
    <text x="28" y="120" fill="#8b949e" font-size="17">2      <tspan fill="#79c0ff">skills</tspan> = [</text>
