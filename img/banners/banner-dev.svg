    <text x="28" y="188" fill="#8b949e" font-size="17">4          <tspan fill="#a5d6ff">"JavaScript"</tspan>,</text>
    <text x="28" y="222" fill="#8b949e" font-size="17">5          <tspan fill="#a5d6ff">"PHP"</tspan>,</text>
    <text x="28" y="256" fill="#8b949e" font-size="17">6          <tspan fill="#a5d6ff">"Solidity"</tspan>,</text>
    <text x="28" y="282" fill="#8b949e" font-size="17">7      ]  <tspan fill="#10b981"># 18+ years</tspan></text>
