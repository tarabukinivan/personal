<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a24"/>
      <stop offset="0.55" stop-color="#0e2a33"/>
      <stop offset="1" stop-color="#10394d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <g stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600"/>
    <path d="M200 0 V600 M400 0 V600 M600 0 V600 M800 0 V600 M1000 0 V600 M1200 0 V600 M1400 0 V600"/>
  </g>

  <!-- community circles -->
  <g transform="translate(1120,300)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="2"/>
    <g fill="#22d3ee">
      <circle cx="120" cy="0" r="15"/>
      <circle cx="93" cy="93" r="13"/>
      <circle cx="0" cy="120" r="15"/>
      <circle cx="-93" cy="93" r="12"/>
      <circle cx="-120" cy="0" r="15"/>
      <circle cx="-93" cy="-93" r="13"/>
      <circle cx="0" cy="-120" r="15"/>
      <circle cx="93" cy="-93" r="12"/>
      <circle cx="180" cy="60" r="10"/>
      <circle cx="-180" cy="-60" r="10"/>
      <circle cx="60" cy="-180" r="10"/>
      <circle cx="-60" cy="180" r="10"/>
    </g>
    <circle cx="0" cy="0" r="46" fill="url(#accent)"/>
    <text x="0" y="10" text-anchor="middle" fill="#0b1a24" font-family="Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700">8+</text>
  </g>

  <!-- text block -->
  <g transform="translate(110,300)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="-158" width="150" height="34" rx="17" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="75" y="-135" text-anchor="middle" fill="#fcd34d" font-size="16" letter-spacing="2">EXPERTISE</text>
    <text x="0" y="-60" fill="#ffffff" font-size="56" font-weight="700">Ambassador &amp; Community</text>
    <rect x="0" y="-30" width="520" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="30" fill="#cbd5e1" font-size="24">8+ years across ambassador programs and retroactive airdrops</text>
    <text x="0" y="68" fill="#94a3b8" font-size="20">Content, moderation, testing, event organization</text>
    <g transform="translate(0,120)" fill="#e2e8f0" font-size="19">
      <text x="0" y="0">✓ Dozens of programs since 2017, from testnets to mainnets</text>
      <text x="0" y="38">✓ Trusted moderator &amp; contributor role in multiple communities</text>
    </g>
